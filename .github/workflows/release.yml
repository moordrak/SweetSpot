name: Release

# Svaka oznaka oblika v1.2.3 gradi Docker sliku, objavljuje je na ghcr.io
# i stvara GitHub release s instalacijskom skriptom i agentom.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -r sweetspot-agent.zip agent
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Instalacija

          **Proxmox** (stvara LXC kontejner s Dockerom i pokreće SweetSpot), kao root na hostu:

              wget https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh
              bash install.sh

          **Postojeći Docker host:** \`bash install.sh --local\`

          **Docker slika:** \`ghcr.io/moordrak/sweetspot:${version}\`

          **Agent za PC:** raspakirajte \`sweetspot-agent.zip\` i slijedite upute u README-u.
          EOF
          gh release create "$GITHUB_REF_NAME" install.sh sweetspot-agent.zip \
            --title "SweetSpot $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
