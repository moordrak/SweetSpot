[server]
; Adresa aplikacije SweetSpot na Proxmoxu (IP Docker hosta i port iz docker-compose.yml)
url = http://192.168.1.50:8085
; Ista vrijednost kao API_TOKEN u datoteci .env na poslužitelju
token = promijenite-ovu-lozinku

[agent]
; Pauza u sekundama nakon uspješnog preuzimanja prije ponovnog traženja aparata
pauza = 300
